name: CI & Release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Test and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  release:
    name: Release to npm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    concurrency:
      group: alfred-anycode-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use an OIDC-compatible npm CLI
        run: npm install --global npm@11

      - run: npm ci

      - name: Initialize the published-version baseline when missing
        run: |
          version=$(node --print "require('./package.json').version")
          tag="v${version}"
          if ! git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          fi

      - name: Analyze commits and publish when required
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release
